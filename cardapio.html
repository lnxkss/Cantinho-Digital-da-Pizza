<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantinho da Pizza - Cardápio</title>
    <link rel="stylesheet" href="css/cardapio.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3132/3132693.png">
</head>
<body>
    <header class="header"></header></div>
    <div class="fundoHorarios" onclick="fecharHorarios(this)"></div>
    <div class="horariosD" onclick="fecharHorarios(this)"></div>

    <div class="tituloEPizzas">
        <div class="escolha">
        <h1>TAMANHOS</h1>
        </div>
    <div class="pizzas">

        <div class="pizza">
            <p class="check">✔</p>
                <img src="imgs/pizza-media.webp" alt="Cantinho da Pizza" id="pizza1" draggable="false">
                <div class="tamanho">
                    <h1><strong>- MÉDIA -</strong></h1>
                    <p>6 PEDAÇOS</p>
                </div>
        </div>

        <div class="pizza">
            <p class="check">✔</p>
                <img src="imgs/pizza-grande.webp" alt="Cantinho da Pizza" id="pizza2" draggable="false">
                <div class="tamanho">
                    <h1><strong>- GRANDE -</strong></h1>
                    <p>8 PEDAÇOS</p>
                </div>
        </div>

        <div class="pizza">
            <p class="check">✔</p>
                <img src="imgs/pizza-gigante.webp" alt="Cantinho da Pizza" id="pizza3" draggable="false">
                <div class="tamanho">
                    <h1><strong>- GIGANTE -</strong></h1>
                    <p>12 PEDAÇOS</p>
                </div>

        </div>
    </div>
    </div>

    <div id="saborDiv">
    <div class="categorias">
        <button type="button" class="btnSelecionado" onclick="trocarClasse(this)"><p>TODAS</p></button>
        <button type="button" class="btn" onclick="trocarClasse(this)"><p>SALGADAS</p></button>
        <button type="button" class="btn" onclick="trocarClasse(this)"><p>DOCES</p></button>
        <button type="button" class="btn" onclick="trocarClasse(this)"><p>BEBIDAS</p></button>
    </div>

    <div class="sabores" id="sabores">
    </div>
    </div>

    <footer class="rodape">
    <div class="localizacao">
        <p>Rua Orminda Freitas Cezar 291</p>
        <p>Atendimento das 18:00 as 23:00</p>
    </div>
</footer>

    <script src="cardapio.js"></script>
    <script src="header.js"></script>

</html>
